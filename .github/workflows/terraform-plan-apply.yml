name: Terraform Plan and Apply

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository to the GitHub Actions runner
        uses: actions/checkout@v4

      - name: Login to Azure via Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install the latest version of the Terraform CLI
        uses: hashicorp/setup-terraform@v3

      - name: Initialize a new or existing Terraform working directory
        run: terraform init

      - name: Generates an execution plan for Terraform
        run: terraform plan -out=tfplan

      - name: Save plan to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-plan]

    steps:
      - name: Checkout the repository to the GitHub Actions runner
        uses: actions/checkout@v4

      - name: Install the latest version of Terraform CLI
        uses: hashicorp/setup-terraform@v3

      - name: Initialize a new or existing Terraform working directory
        run: terraform init

      - name: Download saved plan from artifacts
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
